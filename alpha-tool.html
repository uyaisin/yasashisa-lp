<!doctype html><meta charset="utf-8"><canvas id=c></canvas>
<script>
async function cutBg(src,maxW){const img=new Image();img.src=src;await img.decode();
const sc=Math.min(1,maxW/img.width);const w=Math.round(img.width*sc),h=Math.round(img.height*sc);
const c=document.getElementById('c');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
const d=x.getImageData(0,0,w,h),p=d.data;const bg=[p[4*(w*5+5)],p[4*(w*5+5)+1],p[4*(w*5+5)+2]];
for(let i=0;i<p.length;i+=4){const dr=p[i]-bg[0],dg=p[i+1]-bg[1],db=p[i+2]-bg[2];const dist=Math.sqrt(dr*dr+dg*dg+db*db);
 let a=(dist-14)/40; a=Math.max(0,Math.min(1,a)); p[i+3]=Math.round(a*255);}
x.putImageData(d,0,0);return c.toDataURL('image/png');}
window.cutBg=cutBg;
</script>
